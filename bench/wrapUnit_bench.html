<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>wrapUnit benchmark</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --border: #222;
      --accent: #c8f135;
      --accent2: #35f1c8;
      --muted: #555;
      --text: #e8e8e8;
      --text2: #888;
      --mono: 'Courier New', monospace;
      --sans: Georgia, serif;
      --radius: 4px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      min-height: 100vh;
      padding: 40px 32px;
    }

    header {
      margin-bottom: 36px;
      border-left: 3px solid var(--accent);
      padding-left: 16px;
    }

    header h1 {
      font-family: var(--sans);
      font-size: 22px;
      font-weight: normal;
      color: var(--accent);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    header p {
      color: var(--text2);
      font-size: 12px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      color: var(--text2);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    select,
    input[type=number] {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 6px 10px;
      border-radius: var(--radius);
      outline: none;
      width: 140px;
    }

    select:focus,
    input:focus {
      border-color: var(--accent);
    }

    button#run {
      margin-top: 18px;
      background: var(--accent);
      color: #000;
      border: none;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: bold;
      padding: 8px 24px;
      border-radius: var(--radius);
      cursor: pointer;
      letter-spacing: .04em;
      transition: opacity .1s;
    }

    button#run:hover {
      opacity: .85;
    }

    button#run:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .status {
      color: var(--text2);
      font-size: 12px;
      margin-top: 18px;
      min-height: 18px;
    }

    .status.running {
      color: var(--accent2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 32px;
    }

    th {
      text-align: left;
      color: var(--text2);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 0 12px 10px;
      border-bottom: 1px solid var(--border);
      font-weight: normal;
    }

    th:not(:first-child) {
      text-align: right;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid #161616;
      vertical-align: middle;
    }

    td:not(:first-child) {
      text-align: right;
    }

    tr.winner td {
      color: var(--accent);
    }

    .name {
      color: var(--text);
    }

    .code {
      color: var(--text2);
      font-size: 11px;
      margin-top: 2px;
    }

    .bar-cell {
      width: 180px;
    }

    .bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
    }

    .bar {
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      flex: 1;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--muted);
      transition: width .4s ease;
    }

    tr.winner .bar-fill {
      background: var(--accent);
    }

    .ops {
      color: var(--text);
    }

    .rel {
      font-size: 11px;
    }

    .rel.faster {
      color: var(--accent);
    }

    .rel.slower {
      color: #f13535;
    }

    .rel.same {
      color: var(--text2);
    }

    .note {
      margin-top: 24px;
      color: var(--text2);
      font-size: 11px;
      line-height: 1.8;
      border-left: 2px solid var(--border);
      padding-left: 12px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>wrapUnit · benchmark</h1>
    <p>isolates phase-wrapping strategies · paste into about:blank · incognito</p>
  </header>

  <div class="controls">
    <div class="control-group">
      <label>iterations</label>
      <select id="iters">
        <option value="1000000">1 000 000</option>
        <option value="5000000" selected>5 000 000</option>
        <option value="10000000">10 000 000</option>
        <option value="50000000">50 000 000</option>
      </select>
    </div>
    <div class="control-group">
      <label>input range</label>
      <select id="range">
        <option value="unit">unit [0, 1)</option>
        <option value="near" selected>near [-0.1, 1.1)</option>
        <option value="large">large [-1000, 1000)</option>
      </select>
    </div>
    <div class="control-group">
      <label>runs (averaged)</label>
      <input type="number" id="runs" value="5" min="1" max="20">
    </div>
    <button id="run" type="button">run</button>
  </div>

  <div class="status" id="status"></div>
  <table id="results" class="hidden">
    <thead>
      <tr>
        <th>variant</th>
        <th>ops/sec</th>
        <th>vs fastest</th>
        <th class="bar-cell"></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="note hidden" id="note"></div>

  <script>
    // ─── VARIANTS ────────────────────────────────────────────────────────────────

    const VARIANTS = [
      {
        name: 'modulo + branch',
        code: 'u = u % 1; return u < 0 ? u + 1 : u',
        fn: u => { u = u % 1; return u < 0 ? u + 1 : u; }
      },
      {
        name: 'Math.floor',
        code: 'u -= Math.floor(u); return u',
        fn: u => { u -= Math.floor(u); return u; }
      },
      {
        name: 'bitwise | 0  + branch',
        code: 'u -= (u | 0); return u < 0 ? u + 1 : u',
        fn: u => { u -= (u | 0); return u < 0 ? u + 1 : u; }
      },
      {
        name: 'Math.trunc + branch',
        code: 'u -= Math.trunc(u); return u < 0 ? u + 1 : u',
        fn: u => { u -= Math.trunc(u); return u < 0 ? u + 1 : u; }
      },
      {
        name: '~~u  + branch',
        code: 'u -= ~~u; return u < 0 ? u + 1 : u',
        fn: u => { u -= ~~u; return u < 0 ? u + 1 : u; }
      },
      {
        name: 'subtraction loop',
        code: 'while(u>=1)u-=1; while(u<0)u+=1; return u',
        fn: u => { while (u >= 1) u -= 1; while (u < 0) u += 1; return u; }
      },
    ];

    // ─── INPUT GENERATORS ────────────────────────────────────────────────────────

    function makeInputs(n, range) {
      const arr = new Float64Array(n);
      if (range === 'unit') {
        for (let i = 0; i < n; i++) arr[i] = Math.random();
      } else if (range === 'near') {
        for (let i = 0; i < n; i++) arr[i] = Math.random() * 1.2 - 0.1;
      } else {
        for (let i = 0; i < n; i++) arr[i] = Math.random() * 2000 - 1000;
      }
      return arr;
    }

    // ─── BENCH RUNNER ─────────────────────────────────────────────────────────────

    function runOne(fn, inputs) {
      const n = inputs.length;
      let sink = 0;
      const t0 = performance.now();
      for (let i = 0; i < n; i++) sink += fn(inputs[i]);
      const elapsed = performance.now() - t0;
      return { elapsed, sink };
    }

    async function runBench() {
      const btn = document.getElementById('run');
      const statusEl = document.getElementById('status');
      const table = document.getElementById('results');
      const tbody = document.getElementById('tbody');
      const noteEl = document.getElementById('note');

      btn.disabled = true;
      table.classList.add('hidden');
      noteEl.classList.add('hidden');
      tbody.innerHTML = '';

      const iters = parseInt(document.getElementById('iters').value, 10);
      const range = document.getElementById('range').value;
      const runs = Math.max(1, parseInt(document.getElementById('runs').value, 10) || 5);

      const results = VARIANTS.map(v => ({ ...v, times: [] }));

      for (let r = 0; r < runs; r++) {
        statusEl.className = 'status running';
        statusEl.textContent = `run ${r + 1} / ${runs} — generating inputs…`;
        await tick();

        const inputs = makeInputs(iters, range);

        // Shuffle variant order each run to reduce position bias
        const order = shuffle([...Array(VARIANTS.length).keys()]);

        for (const vi of order) {
          statusEl.textContent = `run ${r + 1} / ${runs} — variant "${VARIANTS[vi].name}"…`;
          await tick();
          // Warmup
          runOne(results[vi].fn, inputs.subarray(0, Math.min(50000, iters)));
          await tick();
          const { elapsed } = runOne(results[vi].fn, inputs);
          results[vi].times.push(elapsed);
        }
      }

      // Median of runs
      results.forEach(r => {
        r.times.sort((a, b) => a - b);
        const mid = Math.floor(r.times.length / 2);
        r.median = r.times[r.times.length % 2 === 0
          ? mid - 1 : mid];
        r.opsPerSec = iters / (r.median / 1000);
      });

      results.sort((a, b) => b.opsPerSec - a.opsPerSec);
      const fastest = results[0].opsPerSec;

      results.forEach((r, i) => {
        const ratio = r.opsPerSec / fastest;
        const pct = (ratio * 100).toFixed(1);
        const relDiff = ((ratio - 1) * 100);
        let relStr, relClass;
        if (i === 0) { relStr = 'fastest'; relClass = 'faster'; }
        else { relStr = `${Math.abs(relDiff).toFixed(1)}% slower`; relClass = 'slower'; }

        const tr = document.createElement('tr');
        if (i === 0) tr.className = 'winner';
        tr.innerHTML = `
      <td>
        <div class="name">${r.name}</div>
        <div class="code">${r.code}</div>
      </td>
      <td class="ops">${fmt(r.opsPerSec)}</td>
      <td class="rel ${relClass}">${relStr}</td>
      <td class="bar-cell">
        <div class="bar-wrap">
          <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
        </div>
      </td>
    `;
        tbody.appendChild(tr);
      });

      const overflowWarning = range === 'large'
        ? ' Note: <code>| 0</code> and <code>~~</code> overflow beyond ±2³¹ — results in that range are unreliable.'
        : '';
      noteEl.innerHTML = `median of ${runs} runs · ${iters.toLocaleString()} iterations · input range: ${range}${overflowWarning}`;

      table.classList.remove('hidden');
      noteEl.classList.remove('hidden');
      statusEl.className = 'status';
      statusEl.textContent = 'done.';
      btn.disabled = false;
    }

    function fmt(n) {
      if (n >= 1e9) return `${(n / 1e9).toFixed(2)} G`;
      if (n >= 1e6) return `${(n / 1e6).toFixed(1)} M`;
      return Math.round(n).toLocaleString();
    }

    function tick() { return new Promise(r => setTimeout(r, 0)); }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    document.getElementById('run').addEventListener('click', runBench);
  </script>
</body>

</html>
